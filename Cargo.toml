[package]
name = "flowcloudai_client"
version = "0.1.2"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
incremental = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# all-arch 引入 Cranelift 的 Pulley 后端，移动端据此把 wasm 编成可移植字节码并解释执行，
# 绕开 JIT 可执行内存在 16KB/64KB 页设备上的对齐崩溃（详见 src/plugin/engine.rs）。
wasmtime = { version = "42", features = ["component-model", "all-arch"] }
anyhow = "1"
log = "0.4"
reqwest = { version = "0.13", features = ["json", "stream", "gzip"] }
serde_json = "1"
zeroize = "1"
zip = "8"
wasmtime-wasi = "42"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
cpal = "0.17"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "pcm", "aac"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
